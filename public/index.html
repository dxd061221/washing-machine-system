<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>宿舍洗衣机 · 实时状态</title>
<style>
  :root{
    --free:#1a7f37; --free-bg:#dafbe1;
    --busy:#0969da; --busy-bg:#e7f3ff;
    --done:#bf6b00; --done-bg:#fff1e5;
    --fault:#cf222e; --fault-bg:#ffebe9;
    --ink:#1f2328; --sub:#59636e; --line:#d1d9e0; --bg:#f6f8fa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:96px}
  header{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 16px 10px;z-index:10}
  h1{font-size:18px;font-weight:700}
  .loc{font-size:13px;color:var(--sub);margin-top:2px}
  .summary{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .chip{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#fff}
  .chip b{font-weight:700}
  .chip.c-free{color:var(--free);border-color:var(--free);background:var(--free-bg)}
  .chip.c-busy{color:var(--busy);border-color:var(--busy);background:var(--busy-bg)}
  .chip.c-done{color:var(--done);border-color:var(--done);background:var(--done-bg)}
  .chip.c-fault{color:var(--fault);border-color:var(--fault);background:var(--fault-bg)}
  main{padding:14px 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(31,35,40,.05)}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .name{font-size:16px;font-weight:700}
  .badge{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .b-free{color:var(--free);background:var(--free-bg)}
  .b-busy{color:var(--busy);background:var(--busy-bg)}
  .b-done{color:var(--done);background:var(--done-bg)}
  .b-fault{color:var(--fault);background:var(--fault-bg)}
  .meta{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.6}
  .stale{display:inline-block;margin-top:6px;font-size:12px;color:#9a6700;background:#fff8c5;border:1px solid #d4a72c;padding:2px 8px;border-radius:6px}
  .remark{font-size:12px;color:var(--sub);margin-top:6px}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .btn{flex:1;min-width:88px;font-size:14px;font-weight:600;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:filter .15s}
  .btn:active{filter:brightness(.92)}
  .btn-primary{background:var(--busy);border-color:var(--busy);color:#fff}
  .btn-green{background:var(--free);border-color:var(--free);color:#fff}
  .btn-orange{background:var(--done);border-color:var(--done);color:#fff}
  .btn-red{background:var(--fault);border-color:var(--fault);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(31,35,40,.92);color:#fff;font-size:14px;padding:10px 18px;border-radius:12px;z-index:99;opacity:0;transition:opacity .25s;max-width:86vw;text-align:center;pointer-events:none}
  .toast.show{opacity:1}
  footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:10}
  .refresh-btn{flex:1;font-size:14px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
  .admin-link{flex:1;font-size:14px;padding:10px;border-radius:10px;background:var(--ink);color:#fff;text-align:center;text-decoration:none;font-weight:600}
  .updated{text-align:center;font-size:12px;color:var(--sub);margin-top:14px}
  @media (min-width:720px){ .grid{grid-template-columns:repeat(3,1fr)} }
</style>
</head>
<body>
<header>
  <h1>🧺 宿舍洗衣机 · 实时状态</h1>
  <div class="loc" id="loc">加载中…</div>
  <div class="summary" id="summary"></div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="updated" id="updated"></div>
</main>

<footer>
  <button class="refresh-btn" onclick="load()">🔄 刷新</button>
  <a class="admin-link" href="/admin">管理端</a>
</footer>

<div class="toast" id="toast"></div>

<script>
const STATUS = {
  '空闲':  { key:'free',  label:'空闲',   next:[{to:'使用中', text:'▶ 开始使用', cls:'btn-primary'},{to:'故障', text:'⚠ 报修', cls:'btn-red'}] },
  '使用中':{ key:'busy',  label:'使用中', next:[{to:'待取衣', text:'✅ 洗完了', cls:'btn-orange'},{to:'空闲', text:'◀ 取消使用', cls:'btn'},{to:'故障', text:'⚠ 报修', cls:'btn-red'}] },
  '待取衣':{ key:'done',  label:'待取衣', next:[{to:'空闲', text:'📥 已取走', cls:'btn-green'},{to:'故障', text:'⚠ 报修', cls:'btn-red'}] },
  '故障':  { key:'fault', label:'故障',   next:[{to:'空闲', text:'✅ 维修完成', cls:'btn-green'}] },
};

async function load(){
  try{
    const res = await fetch('/api/machines');
    const data = await res.json();
    render(data);
    const u = document.getElementById('updated');
    u.textContent = '最近更新 ' + new Date(data.server_time).toLocaleTimeString('zh-CN',{hour12:false}) + ' · 每 10 秒自动刷新';
  }catch(e){
    showToast('连接失败，请确认服务已启动');
  }
}

function render(data){
  const { machines, summary } = data;
  document.getElementById('loc').textContent = (machines[0]?.location || '洗衣房');
  const chips = [
    ['c-free','空闲',summary['空闲']],
    ['c-busy','使用中',summary['使用中']],
    ['c-done','待取衣',summary['待取衣']],
    ['c-fault','故障',summary['故障']],
  ].map(([c,k,v])=>`<span class="chip ${c}">${k} <b>${v}</b></span>`).join('');
  document.getElementById('summary').innerHTML = chips;

  const grid = document.getElementById('grid');
  grid.innerHTML = machines.map((m)=>{
    const conf = STATUS[m.status] || STATUS['空闲'];
    const btns = conf.next.map(b=>`<button class="btn ${b.cls}" onclick="setStatus(${m.id},'${b.to}')">${b.text}</button>`).join('');
    const stale = m.stale ? `<div class="stale">⚠ 状态可能已过期（超过 2 小时未更新）</div>` : '';
    const remark = m.remark ? `<div class="remark">备注：${m.remark}</div>` : '';
    return `<div class="card">
      <div class="card-top">
        <div class="name">${m.name}</div>
        <span class="badge b-${conf.key}">${conf.label}</span>
      </div>
      <div class="meta">📍 ${m.location}<br>⏱ ${m.minutes_ago} 分钟前更新</div>
      ${stale}${remark}
      <div class="actions">${btns}</div>
    </div>`;
  }).join('');
}

let busy = false;
async function setStatus(id, to){
  if(busy) return; busy = true;
  try{
    const res = await fetch(`/api/machines/${id}/status`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ to, by: '同学' })
    });
    const data = await res.json();
    if(res.ok){ showToast('✅ 状态已更新'); load(); }
    else showToast(data.error || '操作失败');
  }catch(e){ showToast('网络错误'); }
  finally{ busy = false; }
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

load();
setInterval(load, 10000);
</script>
</body>
</html>
